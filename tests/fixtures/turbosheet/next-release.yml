name: next-release

# Changesets release flow (same pattern as lamberto15/better-auth-adapter-prisma8). On every
# push to `next`:
#  - pending changeset files (.changeset/*.md, added by PRs) -> opens or updates a
#    "Version Packages" PR that bumps package.json and rewrites CHANGELOG.md; nothing
#    is published yet.
#  - once that PR is merged (no changesets left, version not on npm yet) -> runs
#    `pnpm run release` (build + `changeset publish`) and publishes to npm.
# A plain push without changesets whose version is already on npm does nothing.

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pnpm/action-setup only installs pnpm; setup-node provides Node and the registry-url
      # that npm/pnpm publish auth needs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      # npm trusted publishing requires Node >= 22.14.0; 24 clears it unambiguously.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build, size
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
          pnpm run size

      # Auth: npm trusted publishing (OIDC). No long-lived npm token in this repo, and
      # NODE_AUTH_TOKEN is deliberately not set: with no auth value in .npmrc, pnpm
      # (>= 11.1.3) falls back to the OIDC token GitHub mints from `id-token: write`.
      # npmjs.com side: package `turbosheet` > Settings > Trusted publishing > GitHub Actions:
      # user `lamberto15`, repository `turbosheet`, workflow `next-release.yml` (exact,
      # case-sensitive), no environment.
      #
      # github-token: prefers a fine-grained PAT (secret RELEASE_PAT: Contents + Pull
      # requests read/write, this repo only), because a PR opened with the default
      # GITHUB_TOKEN does not trigger other workflows, so the "Version Packages" PR would get
      # no CI checks. Falls back to GITHUB_TOKEN when the secret is not set.
      - name: Create release PR or publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm run release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          github-token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

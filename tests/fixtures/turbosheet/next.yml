name: next

on:
  push:
    branches: [next]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # No macOS job: GitHub's macOS runners were never scheduled for this repo and the queued
        # job blocked later runs. turbosheet is pure JS; files are verified in Excel for Mac
        # locally (test/smoke/excel-pack.mjs).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm size
      - name: LibreOffice opens generated files
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
          node test/smoke/generate.mjs out
          node test/smoke/excel-pack.mjs out/pack
          rm out/pack/*encrypted*.xlsx
          for f in out/*.xlsx out/pack/*.xlsx; do soffice --headless --convert-to csv --outdir out/csv "$f"; done
          test "$(ls out/csv | wc -l)" -eq "$(ls out/*.xlsx out/pack/*.xlsx | wc -l)"
